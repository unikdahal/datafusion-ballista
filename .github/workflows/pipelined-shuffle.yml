name: Pipelined shuffle validation

on:
  workflow_dispatch:
  push:
    branches: ['shuffle/**']
    paths: ['.github/workflows/pipelined-shuffle.yml']

permissions:
  contents: read

concurrency:
  group: shuffle-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Scheduler and core tests
        run: cargo test --locked -p ballista-core -p ballista-scheduler --lib
        env:
          ARROW_TEST_DATA: ${{ github.workspace }}/testing/data
          PARQUET_TEST_DATA: ${{ github.workspace }}/parquet-testing/data
      - name: Check executor integration
        run: cargo check --locked -p ballista-executor --all-targets
      - name: Upload generated protocol source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-protocol
          path: ballista/core/src/serde/generated/ballista.rs
