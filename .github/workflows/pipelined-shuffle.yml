name: Pipelined shuffle validation

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run the straggler latency experiment
        type: boolean
        default: false
      stack:
        description: Validate every review branch
        type: boolean
        default: false
  push:
    branches: ['shuffle/**']

permissions:
  contents: read

concurrency:
  group: shuffle-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ inputs.stack && fromJSON('["shuffle/01-input-state","shuffle/02-metadata-protocol","shuffle/03-pipelined-reader","shuffle/04-task-restriction","shuffle/05-stage-resolution","shuffle/06-tail-scheduling","shuffle/07-recovery","shuffle/08-validation","shuffle/review-hardening"]') || fromJSON('[""]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ref: ${{ matrix.ref || github.ref }}
      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup component add rustfmt
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # 2.9.2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Scheduler and core tests
        run: cargo test --locked -p ballista-core -p ballista-scheduler --lib
        env:
          ARROW_TEST_DATA: ${{ github.workspace }}/testing/data
          PARQUET_TEST_DATA: ${{ github.workspace }}/parquet-testing/data
      - name: Check executor integration
        run: |
          cargo check --locked -p ballista-executor --all-targets
          cargo test --locked -p ballista-executor --lib executor_server::test
      - name: End-to-end local and Flight equivalence
        if: hashFiles('ballista/client/tests/pipelined_shuffle.rs') != ''
        run: cargo test --locked -p ballista --test pipelined_shuffle
      - name: Straggler latency experiment
        if: inputs.benchmark && hashFiles('ballista/client/tests/pipelined_shuffle.rs') != ''
        run: cargo test --locked -p ballista --test pipelined_shuffle straggler_latency -- --ignored --nocapture
      - name: Upload generated protocol source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-protocol-${{ strategy.job-index }}
          path: ballista/core/src/serde/generated/ballista.rs
